# third_party/ holds vendored upstream packages (see
# third_party/better_player/FORK.md). They are kept as faithful copies of the
# published package, which means they carry upstream's own analysis_options.yaml
# and dev-only lint packages we don't resolve, plus a demo app that is never
# built here - analyzing them reports ~190 phantom errors that say nothing
# about this codebase. Our own edits to a vendored package are reviewed against
# that package's tooling, not this one's.
#
# **/*.g.dart is generated by build_runner (json_serializable, isar_generator).
# It is not hand-maintained - any edit is overwritten by the next build - and
# isar_generator emits calls to Isar's own @experimental index APIs, which the
# analyzer reports against us even though we never wrote them.
analyzer:
  exclude:
    - "third_party/**"
    - "**/*.g.dart"

