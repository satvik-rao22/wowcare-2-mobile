# org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# android.useAndroidX=true
# android.enableJetifier=true

# 🔥 JVM MEMORY (stable + optimized)
# preferIPv6Addresses: the Crashlytics mapping upload (uploadCrashlyticsMappingFile*) failed with
# `SocketException: Broken pipe` because the IPv4 path corrupted large TLS uploads (bad record mac);
# IPv6 works. Falls back to IPv4 when IPv6 is unavailable.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.net.preferIPv6Addresses=true

# ⚡ Performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# 🔧 Fix Kotlin crash (VERY IMPORTANT)
kotlin.incremental=false

# 🔒 AndroidX
android.useAndroidX=true
android.enableJetifier=true

# 🔒 R8 full optimization (security + size)
android.enableR8.fullMode=true

# 🧹 Optional (clean logs)
org.gradle.warning.mode=none
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
