name: TestFlight Distribution

on:
  push:
    branches:
      - stage

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-stage-distribution
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  testflight:
    name: iOS → TestFlight
    runs-on: macos-latest

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Flutter
      # ----------------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # ----------------------------------------------------------
      # CocoaPods
      # ----------------------------------------------------------

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      # ----------------------------------------------------------
      # Build number
      # ----------------------------------------------------------

      - name: Set build number
        run: |
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "iOS build number: ${GITHUB_RUN_NUMBER}"

      # ----------------------------------------------------------
      # Apple Certificate
      # ----------------------------------------------------------

      - name: Install Apple Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ] || \
             [ -z "$CERTIFICATE_PASSWORD" ] || \
             [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "Apple certificate secrets are missing."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH" login.keychain-db

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      # ----------------------------------------------------------
      # Provisioning Profile
      # ----------------------------------------------------------

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$PROFILE_BASE64" ]; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 is missing."
            exit 1
          fi

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID=$(
            security cms -D -i "$PROFILE_PATH" |
            /usr/libexec/PlistBuddy \
              -c "Print UUID" \
              /dev/stdin
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Provisioning profile installed: $PROFILE_UUID"

      # ----------------------------------------------------------
      # Build IPA
      # ----------------------------------------------------------

      - name: Build UAT IPA
        run: |
          flutter build ipa \
            --release \
            --dart-define=ENVIRONMENT=UAT \
            --build-number="$BUILD_NUMBER"

      - name: Find IPA
        run: |
          IPA_PATH=$(find build/ios/ipa -type f -name "*.ipa" | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found."
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          ls -lh "$IPA_PATH"

      # ----------------------------------------------------------
      # GitHub artifact
      # ----------------------------------------------------------

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wowcare-uat-ios-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 14

      # ----------------------------------------------------------
      # App Store Connect API key
      # ----------------------------------------------------------

      - name: Configure App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "App Store Connect API credentials are missing."
            exit 1
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s' "$ASC_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # ----------------------------------------------------------
      # Upload to TestFlight
      # ----------------------------------------------------------

      - name: Upload IPA to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"