name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
      - stage

  pull_request:
    branches:
      - main
      - develop
      - stage

jobs:

  flutter-checks:
    name: Flutter Analyze & Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Build Debug APK
        run: flutter build apk --debug --dart-define=ENVIRONMENT=STAGE

      - name: Build Release APK
        run: flutter build apk --release --dart-define=ENVIRONMENT=STAGE

      - name: Generate Analyze Report
        run: flutter analyze > flutter_analyze_report.txt

      - name: Upload Analyze Report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-report
          path: flutter_analyze_report.txt

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  ios-build:
    name: iOS Build Validation
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS
        run: flutter build ios --no-codesign --dart-define=ENVIRONMENT=STAGE
