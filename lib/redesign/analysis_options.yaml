# Scoped to lib/redesign/ only. The analyzer picks the nearest
# analysis_options.yaml walking up from each file, so this file governs the
# redesign and nothing else. The repo-root one is entirely commented out, so
# the existing code stays unenforced while new code is held to this bar.
#
# Zero analyzer output is the standard here:
#   flutter analyze lib/redesign
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # A literal hex, size, radius or duration in a feature file fails review,
    # and so does anything the analyzer can catch on its own.
    todo: warning
    dead_code: error
    unused_import: error
    unused_local_variable: error
    unused_element: error
    unused_field: error
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Style, per the plan's clean-code rules.
    prefer_single_quotes: true
    require_trailing_commas: true
    directives_ordering: true
    sort_child_properties_last: true
    unnecessary_parenthesis: true

    # Safety and correctness.
    avoid_print: true
    discarded_futures: true
    unawaited_futures: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    use_build_context_synchronously: true

    # Maintainability.
    flutter_style_todos: true
    prefer_final_locals: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_redundant_argument_values: true
    public_member_api_docs: false
