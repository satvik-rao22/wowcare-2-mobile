# LOCAL-ONLY: the real ffmpeg_kit_flutter_new_https ships no arm64 iOS-simulator
# slice, so it can't link for the simulator on Apple Silicon (Xcode 26). This
# points the dependency at a pure-Dart no-op stub so the app runs on the arm64
# simulator. Uncomment ONLY for local arm64-simulator development — it was
# found still active in a device build (HLS video download silently using the
# stub instead of real ffmpeg there too, since dependency_overrides has no way
# to scope itself to simulator-only builds). Never commit this uncommented.
# dependency_overrides:
#   ffmpeg_kit_flutter_new_https:
#     path: stubs/ffmpeg_kit_flutter_new_https


# flutter:
#   config:
#     enable-lldb-debugging: false
#   uses-material-design: true
flutter:
  uses-material-design: true
  # Only what the app actually loads is bundled. Files still on disk but not
  # listed here are deliberately excluded from the APK; nothing has been
  # deleted from the repo. Re-add an entry when a screen starts using one.
  #
  # `assets/fonts/` is NOT listed: those files reach the app through the
  # `fonts:` block below, and listing them here as well would bundle a second
  # copy of every weight.
  #
  # `assets/vectors/` (41 files) and `assets/languages/` (3) are gone: the
  # first held the onboarding artwork, the second is unread because the app
  # has no localisation delegate.
  assets:
    - assets/icons/
    - assets/forte_auto_pay.html
    - assets/images/WowCarePNG.png
    - assets/images/defaultNewsletter.jpg
    - assets/images/logout_image.png
    - assets/images/upload-photo-video-image.png
    - assets/images/icons/sleep.png
    - assets/bgImages/WowCare_2.png
    - assets/bgImages/def.jpeg
    - assets/bgImages/wowcare_mobile_bg.png
    - assets/lottie/coming-soon-lottie.json
  fonts:
    - family: MervaleScript
      fonts:
        - asset: assets/fonts/mervale_script/MervaleScript-Regular.ttf
    # Manrope stays even though nothing renders in it today: it is the family
    # `AppSkin.legacy` declares, and the guard test only asserts that the
    # *active* skin's faces are bundled. Dropping it would let a skin flip
    # fall back to the platform font without anything failing.
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800

    # Poppins is the ChildcareWow brand typeface (the brand guide substitutes
    # this geometric sans for Modulus Pro, and the production website ships
    # the same family). It is what `AppSkin.childcareWow` renders in — see
    # lib/core/theme/app_theme_config.dart.
    #
    # Four weights, one per tier of the app's weight ladder (see
    # `AppTypeScale` in lib/core/theme/app_theme_config.dart and the
    # "Type weights" section of docs/theming.md):
    #
    #   Regular 400   body copy and everything that is not emphasised
    #   Medium 500    every key and button label
    #   SemiBold 600  titles, names, section and table headers
    #   Bold 700      reserved for attention: amounts, hero figures,
    #                 unread and count badges, alerts
    #
    # Flutter resolves any other requested weight to the nearest bundled
    # face, so the few remaining w800/w900 sites render at Bold. Regular is
    # bundled on purpose: without it w400 silently rendered at Medium and
    # body text was indistinguishable from a button label.
    #
    # MediumItalic covers the 8 italic call sites (message bubbles, hint and
    # caption text); without an italic face Flutter renders them upright,
    # since it does not synthesise a slant for a bundled family.
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700





# Launcher icon, generated with `dart run flutter_launcher_icons`.
# Sources live in tool/app_icon/ (build inputs, deliberately not under assets/
# so they are not bundled into the app). Both are square 1024x1024 renders of
# assets/bgImages/WowCare_2.png, whose own 1000x1240 canvas cannot be used
# directly — a non-square source gets squashed to fit the icon grid.
# The adaptive foreground is near full-bleed because the generated
# mipmap-anydpi-v26/ic_launcher.xml already insets it by 16% for the mask's
# safe zone; regenerate both with tool/app_icon/generate.py.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "tool/app_icon/wowcare_app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "tool/app_icon/wowcare_app_icon_foreground.png"
  remove_alpha_ios: true