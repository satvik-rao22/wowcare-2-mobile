# Launcher icon, generated with `dart run flutter_launcher_icons`.
# Sources live in tool/app_icon/ (build inputs, deliberately not under assets/
# so they are not bundled into the app). Both are square 1024x1024 renders of
# assets/bgImages/WowCare_2.png, whose own 1000x1240 canvas cannot be used
# directly — a non-square source gets squashed to fit the icon grid.
# The adaptive foreground is near full-bleed because the generated
# mipmap-anydpi-v26/ic_launcher.xml already insets it by 16% for the mask's
# safe zone; regenerate both with tool/app_icon/generate.py.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "tool/app_icon/wowcare_app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "tool/app_icon/wowcare_app_icon_foreground.png"
  remove_alpha_ios: true