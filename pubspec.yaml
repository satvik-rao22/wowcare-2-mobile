# LOCAL-ONLY: the real ffmpeg_kit_flutter_new_https ships no arm64 iOS-simulator
# slice, so it can't link for the simulator on Apple Silicon (Xcode 26). This
# points the dependency at a pure-Dart no-op stub so the app runs on the arm64
# simulator. Remove this override to restore real ffmpeg for device/release builds.
dependency_overrides:
  ffmpeg_kit_flutter_new_https:
    path: stubs/ffmpeg_kit_flutter_new_https


flutter:
  config:
    enable-lldb-debugging: false
  uses-material-design: true
  assets:
    - assets/vectors/
    - assets/fonts/
    - assets/images/
    - assets/bgImages/
    - assets/lottie/
    - assets/images/icons/
    - assets/icons/
    - assets/languages/
    - assets/forte_auto_pay.html
  fonts:
    - family: MervaleScript
      fonts:
        - asset: assets/fonts/mervale_script/MervaleScript-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/inter/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/inter/Inter-Black.ttf
          weight: 900

    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800

    - family: Imperial_Script
      fonts:
        - asset: assets/fonts/Imperial_Script/ImperialScript-Regular.ttf
          weight: 200



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/WowCarePNG.png"
  adaptive_icon_background: "#ffffff"   # Optional for Android adaptive icons
  adaptive_icon_foreground: "assets/images/WowCarePNG.png"
